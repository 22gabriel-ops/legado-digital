
workflows:
  ios-simulator:
    name: iOS Simulator - sem assinatura
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ipad_tests
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: npm install

      - name: Preparar arquivos web
        script: |
          mkdir -p web
          cp index.html web/
          cp manifest.webmanifest web/
          cp sw.js web/
          cp icon-192.png web/
          cp icon-512.png web/
          cp guardioes.html web/
          cp privacidade.html web/
          cp exclusao-de-dados.html web/
          cp suporte.html web/
          cp -R site web/

      - name: Aplicar dados fictícios somente nas capturas do simulador
        script: |
          python3 - <<'PY'
          from pathlib import Path
          # This changes only the simulator's web/ copy, never the repository's
          # index.html or guardioes.html (nor the App Store workflow).
          index = Path('web/index.html')
          demo_chat = """
          <script>
          (() => {
            const safe = () => {
              const account = document.getElementById('account');
              if (!account || account.classList.contains('hidden')) return;
              const who = document.getElementById('who');
              if (who) who.textContent = 'Conta de demonstração';
              const chat = document.getElementById('chat-messages');
              if (chat && chat.children.length) {
                const examples = [
                  ['assistant', 'Olá! Quero conhecer suas histórias. Qual lembrança você gostaria de guardar?'],
                  ['user', 'Adoro reunir meus amigos nos fins de semana.'],
                  ['assistant', 'Que boa lembrança! O que torna esses encontros especiais para você?']
                ];
                if (chat.dataset.demo !== '1') {
                  chat.replaceChildren();
                  for (const [role,content] of examples) {
                    const b = document.createElement('div');
                    b.className = 'chat-bubble ' + (role === 'user' ? 'mine' : 'theirs');
                    b.textContent = content;
                    chat.append(b);
                  }
                  chat.dataset.demo = '1';
                  chat.scrollTop = chat.scrollHeight;
                }
              }
            };
            setInterval(safe, 400);
          })();
          </script>
          """
          index.write_text(index.read_text().replace('</body>',demo_chat+'</body>'))
          guardians = Path('web/guardioes.html')
          demo_guardians = """
          <script>
          (() => {
            const render = () => {
              const panel = document.getElementById('panel');
              const entries = document.getElementById('entries');
              if (!panel || panel.classList.contains('hidden') || !entries) return;
              if (entries.dataset.demo === '1') return;
              if (entries.textContent.includes('Carregando')) return;
              entries.replaceChildren();
              for (const [role,person] of [
                ['Guardião principal','Pessoa convidada (demonstração)'],
                ['Guardião substituto','Outra pessoa convidada (demonstração)']
              ]) {
                const row = document.createElement('div');
                row.className = 'item';
                const title = document.createElement('strong');
                title.textContent = role;
                const name = document.createElement('p');
                name.className = 'muted';
                name.textContent = person;
                const status = document.createElement('p');
                status.className = 'status';
                status.textContent = 'Aguardando aceite · convite ainda não enviado';
                row.append(title,name,status);
                entries.append(row);
              }
              entries.dataset.demo = '1';
              const feedback = document.getElementById('feedback');
              if (feedback) feedback.textContent = '';
            };
            setInterval(render, 400);
          })();
          </script>
          """
          guardians.write_text(guardians.read_text().replace('</body>',demo_guardians+'</body>'))
          PY

      - name: Validar projeto
        script: npm run check && npm test

      - name: Gerar projeto iOS
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Compilar para simulador
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO build

      - name: Capturar tela real no simulador iPad de 13 polegadas
        script: |
          set -e
          mkdir -p build/screenshots
          python3 - <<'PY' > /tmp/legado_ipad_udid
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          devices = [d for entries in data['devices'].values() for d in entries if 'iPad' in d['name'] and ('13-inch' in d['name'] or '13 inch' in d['name']) and d['state'] != 'Unavailable']
          if not devices:
              sys.exit('Nenhum simulador de iPad de 13 polegadas está disponível neste Xcode')
          print(devices[0]['udid'])
          PY
          UDID="$(cat /tmp/legado_ipad_udid)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiMode active --wifiBars 3 || true
          xcrun simctl install "$UDID" build/simulator/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.gabrielcruz.legadodigital
          sleep 35
          xcrun simctl io "$UDID" screenshot build/screenshots/Legado_Digital_iPad_13.png
          sips -g pixelWidth -g pixelHeight build/screenshots/Legado_Digital_iPad_13.png


      - name: Testar login e navegação reais no simulador iPad
        script: |
          set -e
          set +x
          : "${MAESTRO_TEST_EMAIL:?Configure MAESTRO_TEST_EMAIL como segredo no Codemagic}"
          : "${MAESTRO_TEST_PASSWORD:?Configure MAESTRO_TEST_PASSWORD como segredo no Codemagic}"
          UDID="$(cat /tmp/legado_ipad_udid)"
          # Official Maestro CLI installer documented by Codemagic.
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p build/screenshots
          # On failure, preserve the actual screen without exposing login secrets.
          trap 'xcrun simctl io "$UDID" screenshot build/screenshots/ipad-login-falha.png || true' ERR
          maestro --device "$UDID" test \
            -e "TEST_EMAIL=$MAESTRO_TEST_EMAIL" \
            -e "TEST_PASSWORD=$MAESTRO_TEST_PASSWORD" \
            .maestro/ipad-post-login.yaml
          # Maestro stores takeScreenshot files under its own test output directory.
          # Copy them to Codemagic artifacts and fail explicitly if absent.
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          roots = [Path.home()/'.maestro'/'tests', Path('build/screenshots'), Path.cwd()]
          dest = Path('build/screenshots')
          dest.mkdir(parents=True, exist_ok=True)
          for name, target in (
              ('ipad-apos-login', 'Legado_Digital_iPad_13_Conversa.png'),
              ('ipad-guardioes', 'Legado_Digital_iPad_13_Guardioes.png'),
          ):
              candidates = [p for root in roots if root.exists() for p in root.rglob('*.png') if p.is_file() and (p.stem == name or p.stem.endswith('/'+name))]
              if not candidates:
                  raise SystemExit('Captura Maestro ausente: ' + name)
              src = max(candidates, key=lambda p: p.stat().st_mtime)
              shutil.copyfile(src, dest/target)
              print('Captura exportada:', dest/target)
          PY
          sips -g pixelWidth -g pixelHeight build/screenshots/Legado_Digital_iPad_13_Conversa.png build/screenshots/Legado_Digital_iPad_13_Guardioes.png

    artifacts:
      - build/simulator/Build/Products/Debug-iphonesimulator/*.app
      - build/screenshots/*.png
      - /tmp/xcodebuild_logs/*.log

  ios-appstore:
    name: iOS App Store - exige conta Apple
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gabrielcruz.legadodigital
    integrations:
      app_store_connect: legado-apple
    scripts:
      - name: Instalar dependencias
        script: npm install

      - name: Preparar arquivos web
        script: |
          mkdir -p web
          cp index.html web/
          cp manifest.webmanifest web/
          cp sw.js web/
          cp icon-192.png web/
          cp icon-512.png web/
          cp guardioes.html web/
          cp privacidade.html web/
          cp exclusao-de-dados.html web/
          cp suporte.html web/
          cp -R site web/

      - name: Validar projeto
        script: npm run check && npm test

      - name: Gerar projeto iOS
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Aplicar ícone oficial e atualizar número da compilação
        script: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          source = pathlib.Path('Legado_Digital_AppIcon_1024.png')
          catalog = pathlib.Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          config = catalog / 'Contents.json'
          if not source.is_file() or not config.is_file():
              raise SystemExit('Ícone oficial ou catálogo iOS não encontrado')
          data = json.loads(config.read_text())
          count = 0
          for entry in data.get('images', []):
              filename = entry.get('filename')
              if not filename:
                  continue
              size = entry.get('size', '1024x1024')
              scale = entry.get('scale', '1x')
              edge = int(float(size.split('x')[0]) * float(scale.rstrip('x')))
              subprocess.run(['sips', '-s', 'format', 'png', '-z', str(edge), str(edge),
                              str(source), '--out', str(catalog / filename)],
                             check=True, stdout=subprocess.DEVNULL)
              count += 1
          if count == 0:
              raise SystemExit('Nenhuma imagem definida no catálogo AppIcon')
          print('Ícone oficial aplicado em', count, 'arquivo(s)')
          project = pathlib.Path('ios/App/App.xcodeproj/project.pbxproj')
          content = project.read_text()
          import re
          updated, n = re.subn(r'(CURRENT_PROJECT_VERSION\s*=\s*)\d+(;)', r'\g<1>4\2', content)
          if n == 0:
              raise SystemExit('CURRENT_PROJECT_VERSION não encontrado')
          project.write_text(updated)
          print('Número da compilação alterado para 4')
          PY

      - name: Aplicar assinatura Apple
        script: xcode-project use-profiles

      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
