
workflows:
  ios-simulator:
    name: iOS Simulator - sem assinatura
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ipad_tests
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: npm install

      - name: Preparar arquivos web
        script: |
          mkdir -p web
          cp index.html web/
          cp manifest.webmanifest web/
          cp sw.js web/
          cp icon-192.png web/
          cp icon-512.png web/
          cp guardioes.html web/
          cp privacidade.html web/
          cp exclusao-de-dados.html web/
          cp suporte.html web/
          cp -R site web/

      - name: Preparar capturas fictícias sem dados reais
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          index = Path('web/index.html')
          html = index.read_text()
          # Replace the original history loader BEFORE the app starts.
          # The simulator never requests actual chat turns for a screenshot.
          begin = html.index('async function loadChat(){')
          finish = html.index("$('chat-send').onclick=",begin)
          demo = """async function loadChat(){
            const chat = $('chat-messages');
            chat.replaceChildren();
            for(const [role,content] of [
              ['assistant','Olá! Qual lembrança você gostaria de guardar no seu Legado?'],
              ['user','Gosto de reunir meus amigos e contar histórias.'],
              ['assistant','Que bom! O que torna esses encontros tão especiais?']
            ]) addChatBubble(role,content);
            chatStatus('');
          }
          """
          html = html[:begin] + demo + html[finish:]
          # Conceal real personal/account fields in simulator screenshots.
          # Keep the chat and Guardians navigation accessible to Maestro.
          html = html.replace('</head>',"""<style>
          #account > .card:not(#legacy-chat-card):not(:has(#open-guardians)):not(:has(#who)) {visibility:hidden!important}
          #who,#saved-phone-label,#account-phone,#account-consent,#whatsapp-code-status {visibility:hidden!important}
          </style></head>""",1)
          index.write_text(html)
          guardians = Path('web/guardioes.html')
          original = guardians.read_text()
          # Static capture-only page: never boot the live guardians JavaScript.
          # This avoids loading private guardians while rendering App Store images.
          style = original[original.index('<style>'):original.index('</style>')+len('</style>')]
          demo_page = """<!doctype html><html lang="pt-BR"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Legado Digital · Guardiões</title>
          """ + style + """
          </head><body><main>
          <a href="./index.html?app=1">← Voltar à minha conta</a>
          <h1>Guardiões do legado</h1>
          <p class="muted">Escolha quem poderá cuidar do seu legado no futuro. Você pode indicar uma pessoa principal e uma substituta.</p>
          <div class="notice"><strong>Importante:</strong> aceitar uma indicação não concede acesso às memórias. A liberação futura exige verificação e autorização separadas.</div>
          <div class="card"><h2>Minhas indicações</h2>
          <div class="item"><strong>Guardião principal</strong>
          <p class="muted">Pessoa convidada (demonstração)</p>
          <p class="status">Aguardando aceite · convite ainda não enviado</p></div>
          <div class="item"><strong>Guardião substituto</strong>
          <p class="muted">Outra pessoa convidada (demonstração)</p>
          <p class="status">Aguardando aceite · convite ainda não enviado</p></div>
          </div></main></body></html>"""
          guardians.write_text(demo_page)
          assert '<script>' not in guardians.read_text()
          assert 'Pessoa convidada (demonstração)' in guardians.read_text()

          PY

      - name: Validar projeto
        script: npm run check && npm test

      - name: Gerar projeto iOS
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Compilar para simulador
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO build

      - name: Capturar tela real no simulador iPad de 13 polegadas
        script: |
          set -e
          mkdir -p build/screenshots
          python3 - <<'PY' > /tmp/legado_ipad_udid
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          devices = [d for entries in data['devices'].values() for d in entries if 'iPad' in d['name'] and ('13-inch' in d['name'] or '13 inch' in d['name']) and d['state'] != 'Unavailable']
          if not devices:
              sys.exit('Nenhum simulador de iPad de 13 polegadas está disponível neste Xcode')
          print(devices[0]['udid'])
          PY
          UDID="$(cat /tmp/legado_ipad_udid)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiMode active --wifiBars 3 || true
          xcrun simctl install "$UDID" build/simulator/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.gabrielcruz.legadodigital
          sleep 35
          xcrun simctl io "$UDID" screenshot build/screenshots/Legado_Digital_iPad_13.png
          sips -g pixelWidth -g pixelHeight build/screenshots/Legado_Digital_iPad_13.png


      - name: Testar login e navegação reais no simulador iPad
        script: |
          set -e
          set +x
          : "${MAESTRO_TEST_EMAIL:?Configure MAESTRO_TEST_EMAIL como segredo no Codemagic}"
          : "${MAESTRO_TEST_PASSWORD:?Configure MAESTRO_TEST_PASSWORD como segredo no Codemagic}"
          UDID="$(cat /tmp/legado_ipad_udid)"
          # Official Maestro CLI installer documented by Codemagic.
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p build/screenshots
          # On failure, preserve the actual screen without exposing login secrets.
          trap 'xcrun simctl io "$UDID" screenshot build/screenshots/ipad-login-falha.png || true' ERR
          maestro --device "$UDID" test \
            -e "TEST_EMAIL=$MAESTRO_TEST_EMAIL" \
            -e "TEST_PASSWORD=$MAESTRO_TEST_PASSWORD" \
            .maestro/ipad-post-login.yaml
          # Maestro stores takeScreenshot files under its own test output directory.
          # Copy them to Codemagic artifacts and fail explicitly if absent.
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          roots = [Path.home()/'.maestro'/'tests', Path('build/screenshots'), Path.cwd()]
          dest = Path('build/screenshots')
          dest.mkdir(parents=True, exist_ok=True)
          for name, target in (
              ('ipad-apos-login', 'Legado_Digital_iPad_13_Conversa.png'),
              ('ipad-guardioes', 'Legado_Digital_iPad_13_Guardioes.png'),
          ):
              candidates = [p for root in roots if root.exists() for p in root.rglob('*.png') if p.is_file() and (p.stem == name or p.stem.endswith('/'+name))]
              if not candidates:
                  raise SystemExit('Captura Maestro ausente: ' + name)
              src = max(candidates, key=lambda p: p.stat().st_mtime)
              shutil.copyfile(src, dest/target)
              print('Captura exportada:', dest/target)
          PY
          sips -g pixelWidth -g pixelHeight build/screenshots/Legado_Digital_iPad_13_Conversa.png build/screenshots/Legado_Digital_iPad_13_Guardioes.png

    artifacts:
      - build/simulator/Build/Products/Debug-iphonesimulator/*.app
      - build/screenshots/*.png
      - /tmp/xcodebuild_logs/*.log

  ios-appstore:
    name: iOS App Store - exige conta Apple
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gabrielcruz.legadodigital
    integrations:
      app_store_connect: legado-apple
    scripts:
      - name: Instalar dependencias
        script: npm install

      - name: Preparar arquivos web
        script: |
          mkdir -p web
          cp index.html web/
          cp manifest.webmanifest web/
          cp sw.js web/
          cp icon-192.png web/
          cp icon-512.png web/
          cp guardioes.html web/
          cp privacidade.html web/
          cp exclusao-de-dados.html web/
          cp suporte.html web/
          cp -R site web/

      - name: Validar conteúdo real para distribuição
        script: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('web/index.html').read_text()
          guardians = Path('web/guardioes.html').read_text()
          assert "async function loadChat(){" in index, "Chat real ausente"
          assert "action:'list'" in index, "Histórico real de conversa não configurado"
          assert "async function load(){" in guardians, "Guardiões reais ausentes"
          assert "legacy_guardians?select=" in guardians, "Consulta de guardiões ausente"
          assert "Pessoa convidada (demonstração)" not in guardians, "Guardião demonstrativo presente na distribuição"
          assert "Conta de demonstração" not in index, "Conta fictícia presente na distribuição"
          print("Verificação: interface real incluída, sem substituições do simulador")
          PY

      - name: Validar projeto
        script: npm run check && npm test

      - name: Gerar projeto iOS
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Aplicar ícone oficial e atualizar número da compilação
        script: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          source = pathlib.Path('Legado_Digital_AppIcon_1024.png')
          catalog = pathlib.Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          config = catalog / 'Contents.json'
          if not source.is_file() or not config.is_file():
              raise SystemExit('Ícone oficial ou catálogo iOS não encontrado')
          data = json.loads(config.read_text())
          count = 0
          for entry in data.get('images', []):
              filename = entry.get('filename')
              if not filename:
                  continue
              size = entry.get('size', '1024x1024')
              scale = entry.get('scale', '1x')
              edge = int(float(size.split('x')[0]) * float(scale.rstrip('x')))
              subprocess.run(['sips', '-s', 'format', 'png', '-z', str(edge), str(edge),
                              str(source), '--out', str(catalog / filename)],
                             check=True, stdout=subprocess.DEVNULL)
              count += 1
          if count == 0:
              raise SystemExit('Nenhuma imagem definida no catálogo AppIcon')
          print('Ícone oficial aplicado em', count, 'arquivo(s)')
          project = pathlib.Path('ios/App/App.xcodeproj/project.pbxproj')
          content = project.read_text()
          import re
          # Apple already has build 5. CM_BUILD_NUMBER increases per Codemagic workflow run.
          build_number = max(6, int(os.environ.get('CM_BUILD_NUMBER', '6')))
          updated, n = re.subn(r'(CURRENT_PROJECT_VERSION\s*=\s*)\d+(;)', lambda m: m.group(1)+str(build_number)+m.group(2), content)
          if n == 0:
              raise SystemExit('CURRENT_PROJECT_VERSION não encontrado')
          project.write_text(updated)
          print('Número da compilação definido para', build_number)
          PY

      - name: Aplicar assinatura Apple
        script: xcode-project use-profiles

      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
