appId: com.gabrielcruz.legadodigital
---
# Use a dedicated, confirmed-email testing account; values are injected from Codemagic secrets.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 30000
- tapOn:
    text: "E-mail"
- inputText: ${TEST_EMAIL}
- tapOn:
    text: "Senha"
- inputText: ${TEST_PASSWORD}
- tapOn:
    text: "Entrar"
    index: 1
- extendedWaitUntil:
    visible: ${TEST_EMAIL}
    timeout: 45000
- assertVisible: ${TEST_EMAIL}
- extendedWaitUntil:
    visible: "Conversar com meu Legado.*"
    timeout: 45000
# After login the page starts near the account header; the chat composer is below.
# Search for the actual input rather than the heading (which contains an emoji).
- scrollUntilVisible:
    element: "Escreva sua mensagem para o seu Legado..."
    direction: DOWN
    timeout: 30000
- assertVisible: "Escreva sua mensagem para o seu Legado..."
- assertVisible: "Enviar"
- waitForAnimationToEnd
- takeScreenshot: "build/screenshots/ipad-apos-login"
# App Review 3.1.1: iOS edition must offer only the free monthly quota.
- scrollUntilVisible:
    element: "Entenda o limite gratuito.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Entenda o limite gratuito.*"
- extendedWaitUntil:
    visible: "Meu Legado gratuito.*"
    timeout: 15000
- assertVisible: "10 interações mensais incluídas.*"
- assertNotVisible: "Meu Legado Plus"
- assertNotVisible: "Meu Legado Exclusivo.*"
- takeScreenshot: "build/screenshots/ipad-gratuito"
- scrollUntilVisible:
    element: "Cadastrar guardiões"
    direction: DOWN
    timeout: 30000
- tapOn: "Cadastrar guardiões"
- extendedWaitUntil:
    visible: "Guardiões do legado"
    timeout: 30000
- scrollUntilVisible:
    element: "Minhas indicações"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "Carregando…"
- waitForAnimationToEnd
- takeScreenshot: "build/screenshots/ipad-guardioes"
